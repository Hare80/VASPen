[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vaspen"
version = "0.1.0"
description = "Cross-platform GUI for VASP first-principles calculations — structure modeling, input file generation, and job management."
readme = "README.md"
license = {text = "Proprietary"}
requires-python = ">=3.11"
authors = [{name = "VASPen Developer"}]
keywords = ["vasp", "dft", "materials-science", "gui", "first-principles"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "PySide6>=6.6",
    "ase>=3.22",
    "pymatgen>=2024.1",
    "spglib>=2.3",
    "numpy>=1.26",
    "scipy>=1.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-qt>=4",
    "pytest-cov>=5",
]
deploy = [
    "pyinstaller>=6",
    "nuitka>=2",
]

[project.scripts]
vaspen = "vaspen.main:main"

[project.urls]
Homepage = "https://github.com/vaspen/vaspen"
Documentation = "https://vaspen.readthedocs.io"

[tool.setuptools.packages.find]
include = ["vaspen*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"

[tool.coverage.run]
source = ["vaspen"]
omit = ["vaspen/ui/__init__.py", "vaspen/core/__init__.py"]
