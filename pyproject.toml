[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vaspen"
version = "0.3.0"
description = "Cross-platform GUI for VASP first-principles calculations — structure modeling, input file generation, and job management."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "Hare80"}]
keywords = ["vasp", "dft", "materials-science", "gui", "first-principles"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "PySide6>=6.6",
    "ase>=3.29",
    "pymatgen>=2024.1",
    "spglib>=2.3",
    "numpy>=1.26",
    "scipy>=1.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-qt>=4",
    "pytest-cov>=5",
]
deploy = [
    "pyinstaller>=6",
    "nuitka>=2",
]

[project.scripts]
vaspen = "vaspen.main:main"

[project.urls]
Homepage = "https://github.com/Hare80/VASPen"
Documentation = "https://github.com/Hare80/VASPen/blob/main/docs/user-guide-en.md"

[tool.setuptools.packages.find]
include = ["vaspen*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"

[tool.coverage.run]
source = ["vaspen"]
omit = ["vaspen/ui/__init__.py", "vaspen/core/__init__.py"]
